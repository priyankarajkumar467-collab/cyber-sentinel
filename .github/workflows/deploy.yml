name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          grep -q "/cyber-sentinel/assets/" dist/index.html || { echo "dist/index.html missing /cyber-sentinel/assets/ reference"; exit 1; }
          ! grep -q "/src/main.tsx" dist/index.html || { echo "dist/index.html incorrectly references /src/main.tsx"; exit 1; }
          echo "Build verification passed: dist/index.html contains compiled assets and no source references."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
